<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- YuE2 Studio icon: an eighth note rising out of a sung waveform, on a late-night stage gradient. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#170b3b"/>
      <stop offset="0.55" stop-color="#3b0d63"/>
      <stop offset="1" stop-color="#7a1450"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.82" r="0.62">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#ff5470" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff5470" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset="0.5" stop-color="#ffd36b"/>
      <stop offset="1" stop-color="#ff9a3c"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cf2ff" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#7cf2ff"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="0.8" stop-color="#ff9ad5"/>
      <stop offset="1" stop-color="#ff9ad5" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#12002a" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- faint sound rings -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="10">
    <circle cx="512" cy="470" r="300"/>
    <circle cx="512" cy="470" r="390"/>
    <circle cx="512" cy="470" r="480"/>
  </g>

  <!-- waveform: equaliser bars across the lower third -->
  <g fill="url(#wave)">
    <rect x="96"  y="742" width="30" height="60"  rx="15"/>
    <rect x="146" y="712" width="30" height="120" rx="15"/>
    <rect x="196" y="682" width="30" height="180" rx="15"/>
    <rect x="246" y="722" width="30" height="100" rx="15"/>
    <rect x="296" y="652" width="30" height="240" rx="15"/>
    <rect x="346" y="692" width="30" height="160" rx="15"/>
    <rect x="396" y="632" width="30" height="280" rx="15"/>
    <rect x="598" y="662" width="30" height="220" rx="15"/>
    <rect x="648" y="702" width="30" height="140" rx="15"/>
    <rect x="698" y="642" width="30" height="260" rx="15"/>
    <rect x="748" y="702" width="30" height="140" rx="15"/>
    <rect x="798" y="682" width="30" height="180" rx="15"/>
    <rect x="848" y="722" width="30" height="100" rx="15"/>
    <rect x="898" y="742" width="30" height="60"  rx="15"/>
  </g>

  <!-- glow behind the note -->
  <ellipse cx="470" cy="700" rx="150" ry="110" fill="#ffb347" opacity="0.55" filter="url(#soft)"/>

  <!-- eighth note -->
  <g filter="url(#shadow)">
    <ellipse cx="452" cy="712" rx="122" ry="94" transform="rotate(-24 452 712)" fill="url(#gold)"/>
    <rect x="540" y="214" width="40" height="500" rx="20" fill="url(#gold)"/>
    <path d="M560 214 C 640 250, 760 300, 742 440 C 732 510, 700 540, 676 560
             C 712 500, 714 430, 664 392 C 624 362, 590 356, 560 352 Z" fill="url(#gold)"/>
  </g>

  <!-- sparkle -->
  <g fill="#ffffff" opacity="0.9">
    <path d="M790 210 l12 38 l38 12 l-38 12 l-12 38 l-12 -38 l-38 -12 l38 -12 z"/>
    <path d="M300 300 l7 22 l22 7 l-22 7 l-7 22 l-7 -22 l-22 -7 l22 -7 z" opacity="0.7"/>
  </g>
</svg>
